name: Deploy ACCP (CMS)

# The accp worker (rinsly-accp) is the dynamic Payload CMS + live preview at
# accp.rinsly.com. "pnpm run deploy" migrates the accp D1 then builds + deploys
# via opennextjs-cloudflare.
#
# Branch → environment: `develop` is the staging line and deploys HERE, so work
# is exercised on accp before it reaches the public site. `main` deploys
# production (see deploy-prod.yml). Always merge develop → main, never push code
# straight to main: production would then run ahead of the CMS/API that the
# static build snapshots its content from.
#
# Self-contained (inlined) copy of the fleet pipeline. Canonical source:
# rinsly-com/Template/.github/workflows/ (accp/prod split) — kept in sync by
# the fleet tooling. (Inlined rather than referenced because GitHub's private
# cross-repo reusable-workflow access was unreliable for this org.)
#
# Custom domains are attached in the Cloudflare dashboard (not in wrangler.jsonc),
# so the CLOUDFLARE_API_TOKEN only needs account-level perms (no zone/Workers
# Routes).

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-rinsly-accp
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js + GitHub Packages auth
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rinsly-com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Build + deploy
        run: |
          pnpm run deploy:database
          pnpm exec opennextjs-cloudflare build
          pnpm exec wrangler deploy --dispatch-namespace rinsly-fleet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
