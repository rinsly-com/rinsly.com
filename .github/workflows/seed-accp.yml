name: Seed ACCP (content)

# Re-seeds the accp Payload CMS content (pages + globals) from scripts/seed.ts.
# Idempotent — safe to re-run; it rebuilds the home page + globals, deletes any
# stray non-home pages, and re-publishes (see the header comment in
# scripts/seed.ts).
#
# Manual only, on purpose: a content push is a human decision, never something
# that should happen automatically on merge. This workflow only runs when
# someone explicitly dispatches it — from the Actions tab, or:
#   gh workflow run seed-accp.yml
#
# NODE_ENV=production makes the Payload CLI resolve the real remote D1 + R2
# bindings declared in wrangler.jsonc instead of the local dev mock — this
# writes to the live accp database. There is no dry-run mode; review
# scripts/seed.ts before dispatching if you're unsure what a run will change.
#
# First run on a database with no admin yet creates one from
# SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD. Set both as repository secrets
# before the first dispatch against a fresh accp — without them the seed falls
# back to the well-known dev@rinsly.local / rinsly-dev credentials, which must
# never end up on a live, internet-reachable admin panel. Safe to leave unset
# on every run after the first: an existing admin is never recreated.
#
# Shares deploy-accp.yml's concurrency group so a seed and a deploy can never
# race each other against the same worker/database.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-rinsly-accp
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js + GitHub Packages auth
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rinsly-com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Seed content
        run: NODE_ENV=production pnpm seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
