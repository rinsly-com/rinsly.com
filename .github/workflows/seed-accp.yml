name: Seed ACCP (content)

# Bootstraps the accp Payload CMS content (pages + globals) from scripts/seed.ts.
# Since DF1 (26 Nov 2026) accp D1 is the source of truth for the copy: the seed
# only creates pages that do not exist, finishes incomplete locales (draft-only
# or empty layout, header/footer locales with no copy text), and never rewrites
# a published locale that already has content (see scripts/seedLock.ts). Setting
# the repository variable RINSLY_HANDED_OVER to 1, true, or yes refuses this
# workflow outright (default-open: unset, empty, 0, false, or no still runs).
#
# Manual only, on purpose: a content push is a human decision, never something
# that should happen automatically on merge. This workflow only runs when
# someone explicitly dispatches it — from the Actions tab, or:
#   gh workflow run seed-accp.yml
#
# NODE_ENV=production makes the Payload CLI use the remote D1 and R2 bindings
# in wrangler.jsonc (the accp CMS database, not the static production site).
# That is still a remote write. There is no dry-run mode; review
# scripts/seed.ts before dispatching if you're unsure what a run will create.
# In production the seed also skips orphan-version repair and will not promote
# an existing user to admin.
#
# First run on a database with no admin yet creates one from
# SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD. Set both as repository secrets
# before the first dispatch against a fresh accp — without them the seed falls
# back to the well-known dev@rinsly.local / rinsly-dev credentials, which must
# never end up on a live, internet-reachable admin panel. Safe to leave unset
# on every run after the first: an existing admin is never recreated, and an
# existing non-admin user is never promoted.
#
# Shares deploy-accp.yml's concurrency group so a seed and a deploy can never
# race each other against the same worker/database.

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-rinsly-accp
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js + GitHub Packages auth
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rinsly-com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Seed content
        run: NODE_ENV=production pnpm seed
        env:
          SEED_COMMAND: seed-accp
          RINSLY_HANDED_OVER: ${{ vars.RINSLY_HANDED_OVER }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
