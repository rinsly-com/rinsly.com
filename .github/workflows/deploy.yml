name: Deploy

# rinsly is a single dynamic Worker (admin + API + SSR). "pnpm run deploy"
# migrates the remote D1 (lint:migrations first) then builds + deploys via
# opennextjs-cloudflare. Delegates to the central pipeline in the template repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-rinsly
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: read
    uses: rinsly-com/rinsly-template/.github/workflows/site-deploy.yml@main
    secrets: inherit
    # deploy-command defaults to "pnpm run deploy".
