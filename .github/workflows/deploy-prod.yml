name: Deploy production (static)

# The public production site (rinsly worker) is a fully static export of the
# published content, snapshotted from the live accp CMS API at build time.
#
# Branch → environment: `main` is the production line and deploys HERE; code
# reaches it by merging `develop` (which deploys accp — see deploy-accp.yml), so
# everything is exercised on accp first. Pushing code straight to main skips that
# check AND leaves production running ahead of the CMS/API it snapshots content
# from, so always merge develop → main.
#
# Content changes never deploy on their own: publishing a page only decides what
# the NEXT build ships. Editors ship it with the CMS "Deploy now" button
# (repository_dispatch), which is also how a content-only release happens with no
# code change. A manual run from the Actions tab does the same.
#
# Self-contained (inlined) copy of the fleet pipeline. Canonical source:
# rinsly-com/Template/.github/workflows/ (accp/prod split) — kept in sync by
# the fleet tooling. Custom domains live in the Cloudflare dashboard, so an
# account-level CLOUDFLARE_API_TOKEN suffices (no zone/Workers Routes perms).

run-name: Deploy prod — ${{ github.event.client_payload.reason || github.event_name }}

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-static]
  workflow_dispatch:

concurrency:
  group: deploy-rinsly-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Production is ALWAYS built from `main`, whatever dispatched the run.
          #
          # GitHub runs a repository_dispatch against the DEFAULT branch, which is
          # `develop`. So without pinning this, the CMS "Deploy now" button would
          # build the public site from staging code — silently, and only once
          # develop had moved ahead of main. A push to main already checks out
          # main, and a manual run keeps whichever ref was chosen.
          ref: ${{ github.event_name == 'repository_dispatch' && 'main' || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js + GitHub Packages auth
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rinsly-com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}

      - name: Build + deploy (static)
        # deploy:static → build out/, then versions upload + deploy @ 100%
        # (scripts/deploy-static.mjs — PLAN-zero-downtime-deploys.md)
        run: pnpm run deploy:static
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PAYLOAD_API_URL: https://accp.rinsly.com
          DISPATCH_NAMESPACE: rinsly-fleet
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
